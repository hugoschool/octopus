- name: Install python3, pip & venv
  ansible.builtin.apt:
    pkg:
      - python3
      - python3-pip
      - python3-venv
    state: present

- name: Create directory
  ansible.builtin.file:
    path: /app
    state: directory

- name: Copy application
  ansible.builtin.copy:
    src: ../../../poll.tar
    dest: /app/poll.tar

- name: Unarchive the application
  ansible.builtin.unarchive:
    src: /app/poll.tar
    dest: /app
    remote_src: true

- name: Create venv and install specified python requirements
  ansible.builtin.pip:
    requirements: /app/poll/requirements.txt
    virtualenv: /app/poll/.venv
    virtualenv_command: python3 -m venv

- name: Allow port 80 in the firewall
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp

- name: Copy systemd service
  register: systemd_service
  ansible.builtin.template:
    src: files/poll.service
    dest: /etc/systemd/system/poll.service

- name: Enable application service
  when: systemd_service.changed
  ansible.builtin.service:
    name: poll
    state: restarted
    enabled: true
