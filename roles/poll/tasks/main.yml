- name: Install python3, pip & venv
  become: true
  ansible.builtin.apt:
    pkg:
      - python3
      - python3-pip
      - python3-venv
    state: present

- name: Create directory
  become: true
  ansible.builtin.file:
    path: /app
    state: directory
    owner: "{{ ansible_user }}"
    mode: "0755"

- name: Copy application
  ansible.builtin.copy:
    src: ../../../poll.tar
    dest: /app/poll.tar
    mode: "0664"

- name: Unarchive the application
  ansible.builtin.unarchive:
    src: /app/poll.tar
    dest: /app
    remote_src: true

- name: Create venv and install specified python requirements
  ansible.builtin.pip:
    requirements: /app/poll/requirements.txt
    virtualenv: /app/poll/.venv
    virtualenv_command: python3 -m venv

- name: Allow port 80 in the firewall
  become: true
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp

- name: Copy systemd service
  become: true
  ansible.builtin.template:
    src: files/poll.service
    dest: /etc/systemd/system/poll.service
    mode: "0644"
  notify:
    - Restart application service

- name: Enable application service
  become: true
  ansible.builtin.service:
    name: poll
    state: started
    enabled: true
