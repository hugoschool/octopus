- name: Install maven & OpenJDK 21
  become: true
  ansible.builtin.apt:
    pkg:
      - maven
      - openjdk-21-jdk
    state: present

- name: Create directory
  become: true
  ansible.builtin.file:
    path: /app
    state: directory
    owner: "{{ ansible_user }}"
    mode: "0755"

- name: Copy application
  ansible.builtin.copy:
    src: ../../../worker.tar
    dest: /app/worker.tar
    mode: "0664"

- name: Unarchive the application
  ansible.builtin.unarchive:
    src: /app/worker.tar
    dest: /app
    remote_src: true
  notify:
    - Install dependencies

- name: Package jar file
  ansible.builtin.command: mvn package
  args:
    chdir: /app/worker
    creates: /app/worker/target/worker-jar-with-dependencies.jar

- name: Copy systemd service
  become: true
  ansible.builtin.template:
    src: files/worker.service
    dest: /etc/systemd/system/worker.service
    mode: "0644"
  notify:
    - Restart application service

- name: Enable application service
  become: true
  ansible.builtin.service:
    name: worker
    state: started
    enabled: true
