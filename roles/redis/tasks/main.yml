- name: Install Redis
  ansible.builtin.apt:
    pkg:
      - redis
    state: present

- name: Copy configuration
  register: redis_conf
  ansible.builtin.copy:
    src: files/redis.conf
    dest: /etc/redis/redis.conf
    mode: "0644"

- name: Allow Redis in the firewall
  community.general.ufw:
    rule: allow
    port: "6379"
    proto: tcp

- name: Enable redis
  when: redis_conf.changed
  ansible.builtin.service:
    name: redis-server
    state: restarted
    enabled: true
