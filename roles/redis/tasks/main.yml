- name: Install Redis
  ansible.builtin.apt:
    pkg:
      - redis
    state: present

- name: Copy configuration
  ansible.builtin.copy:
    src: files/redis.conf
    dest: /etc/redis/redis.conf
    mode: "0644"
  notify:
    - Restart redis

- name: Allow Redis in the firewall
  community.general.ufw:
    rule: allow
    port: "6379"
    proto: tcp
    src: "{{ item }}"
  loop:
    - "{{ hostvars['result-1']['ansible_host'] }}"
    - "{{ hostvars['poll-1']['ansible_host'] }}"
    - "{{ hostvars['worker-1']['ansible_host'] }}"

- name: Enable redis
  ansible.builtin.service:
    name: redis-server
    state: started
    enabled: true
