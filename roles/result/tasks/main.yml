- name: Install NodeJS & NPM
  become: true
  ansible.builtin.apt:
    pkg:
      - nodejs
      - npm
    state: present

- name: Create directory
  become: true
  ansible.builtin.file:
    path: /app
    state: directory
    owner: "{{ ansible_user }}"
    mode: "0755"

- name: Copy application
  ansible.builtin.copy:
    src: ../../../result.tar
    dest: /app/result.tar
    mode: "0664"

- name: Unarchive the application
  ansible.builtin.unarchive:
    src: /app/result.tar
    dest: /app
    remote_src: true

# Why is there no package-lock.json?
# We could've done an easy npm ci instead of npm install...
- name: Install dependencies
  community.general.npm:
    path: /app/result

- name: Allow port 80 in the firewall
  become: true
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp

- name: Copy systemd service
  become: true
  ansible.builtin.template:
    src: files/result.service
    dest: /etc/systemd/system/result.service
    mode: "0644"
  notify:
    - Restart application service

- name: Enable application service
  become: true
  ansible.builtin.service:
    name: result
    state: started
    enabled: true
