- name: Install NodeJS & NPM
  ansible.builtin.apt:
    pkg:
      - nodejs
      - npm
    state: present

- name: Create directory
  ansible.builtin.file:
    path: /app
    state: directory

- name: Copy application
  ansible.builtin.copy:
    src: ../../../result.tar
    dest: /app/result.tar

- name: Unarchive the application
  ansible.builtin.unarchive:
    src: /app/result.tar
    dest: /app
    remote_src: yes

# Why is there no package-lock.json?
# We could've done an easy npm ci instead of npm install...
- name: Install dependencies
  community.general.npm:
    path: /app/result

- name: Allow port 80 in the firewall
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp

- name: Copy systemd service
  register: systemd_service
  ansible.builtin.template:
    src: files/result.service
    dest: /etc/systemd/system/result.service

- name: Enable application service
  when: systemd_service.changed
  ansible.builtin.service:
    name: result
    state: restarted
    enabled: true
